<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Chaso</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f3eee9;
  text-align: center;
}

.container {
  padding: 30px;
}

h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

.red { color: #ff6b6b; }
.green { color: #4ecdc4; }

.subtitle {
  color: #555;
  font-size: 16px;
  margin-bottom: 30px;
}

/* Cards */
.card {
  width: 260px;
  margin: 20px auto;
  padding: 25px;
  border-radius: 20px;
  text-align: left;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card h3 {
  margin-top: 10px;
}

.yellow { background: #ffe66d; }
.teal { background: #70c1b3; }
.blue { background: #a8dadc; }

/* Button */
.btn {
  margin-top: 30px;
  padding: 15px 40px;
  border: none;
  border-radius: 30px;
  background: #222;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #444;
}
</style>
</head>

<body>

<div class="container">

  <h1><span class="red">Campus</span><span class="green">Chaso</span></h1>

  <p class="subtitle">
    Track attendance, assignments, exams easily
  </p>

  <div class="card yellow">
    <h3>📊 Attendance</h3>
    <p>Never miss (too many) classes</p>
  </div>

  <div class="card teal">
    <h3>📝 Assignments</h3>
    <p>Track deadlines before they track you</p>
  </div>

  <div class="card blue">
    <h3>📚 Exams</h3>
    <p>Stay prepared always</p>
  </div>

  <button class="btn" onclick="goToLogin()">Get Started</button>

</div>

<script>
function goToLogin() {
  window.location.href = "login.html";
}
</script>

</body>
</html>
